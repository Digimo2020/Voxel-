# build.yml (v1.1) - [2026-10-31]
name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Smoke Test
      run: |
        python -c "import PyQt6, pynput, pyperclip, edge_tts, pypdf; from PyQt6.QtMultimedia import QMediaPlayer; print('All core macOS modules verified')"

    - name: Build macOS DMG
      run: |
        chmod +x build_mac.sh
        ./build_mac.sh

    - name: Upload macOS DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Voxel-macOS-DMG
        if-no-files-found: error
        path: |
          dist/Voxel.dmg
          dist/Voxel-*.dmg
          dist/SHA256SUMS.txt

    - name: Release macOS DMG
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Voxel.dmg
          dist/Voxel-*.dmg
          dist/SHA256SUMS.txt
        fail_on_unmatched_files: true
        generate_release_notes: true

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Standalone Windows Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Voxel" --icon "assets/icon.ico" --add-data "assets;assets" --collect-all edge_tts --collect-all certifi --collect-all pypdf --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtMultimediaWidgets --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtTest --exclude-module PyQt6.QtXml main.py
        python -c "from src.utils.version import CURRENT_VERSION; import shutil; shutil.copy('dist/Voxel.exe', f'dist/Voxel-{CURRENT_VERSION}.exe'); print(f'Created dist/Voxel-{CURRENT_VERSION}.exe')"

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Voxel-Windows-EXE
        if-no-files-found: warn
        path: |
          dist/Voxel.exe
          dist/Voxel-*.exe

    - name: Release Windows Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Voxel.exe
          dist/Voxel-*.exe
        fail_on_unmatched_files: false
        generate_release_notes: true
