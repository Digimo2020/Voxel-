name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Smoke Test
      run: |
        python -c "import PyQt6, pynput, pyperclip, edge_tts; from PyQt6.QtMultimedia import QMediaPlayer; print('All core macOS modules verified')"

    - name: Build macOS App & DMG
      run: |
        chmod +x build_mac.sh
        ./build_mac.sh
        cd dist && zip -r Voxel-macOS.zip Voxel.app

    - name: Upload macOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Voxel-macOS-Package
        path: |
          dist/Voxel.pkg
          dist/Voxel.dmg
          dist/Voxel-macOS.zip

    - name: Release macOS Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Voxel.pkg
          dist/Voxel.dmg
          dist/Voxel-macOS.zip
        generate_release_notes: true

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Standalone Windows Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Voxel" --collect-all edge_tts --collect-all certifi --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 main.py

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Voxel-Windows-EXE
        path: dist/Voxel.exe

    - name: Release Windows Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/Voxel.exe
        generate_release_notes: true
