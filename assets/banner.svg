<rect x="536" y="410" width="124" height="52" rx="26" fill="#202f50"/><text x="565" y="444" fill="#fff" font-family="Arial,sans-serif" font-size="20">Jenny⌄</text>
<text x="690" y="446" fill="#c8d2e7" font-family="Arial,sans-serif" font-size="26">⚙</text><text x="785" y="446" fill="#c8d2e7" font-family="Arial,sans-serif" font-size="26">×</text>
<path d="M894 399 V476" stroke="#34466e" stroke-width="1.5"/>
