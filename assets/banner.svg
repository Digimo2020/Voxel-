<text x="1052" y="444" fill="#f4f6ff" font-family="Inter,Arial,sans-serif" font-size="27">Floating Trigger on Selected Text</text>
<path d="M72 522 H1528" stroke="#526384" stroke-width="1.3" opacity=".7"/>
<g font-family="Inter,Arial,sans-serif">
 <g transform="translate(82 560)"><rect width="54" height="54" rx="14" fill="#10264a" stroke="#28539a"/><path d="M27 12v22m-9-9 9 9 9-9M15 39h24" fill="none" stroke="#10baff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="23" fill="#14bfff" font-size="22" font-weight="700">System-Wide Installer</text><text x="78" y="57" fill="#c5d0e4" font-size="18">Install once and read text</text><text x="78" y="82" fill="#c5d0e4" font-size="18">across your apps</text></g>
 <path d="M480 561v94" stroke="#314365"/>
 <g transform="translate(510 560)"><rect width="54" height="54" rx="14" fill="#10264a" stroke="#28539a"/><g stroke="#13bdff" stroke-width="4" stroke-linecap="round"><path d="M14 22v11"/><path d="M22 14v27"/><path d="M30 19v17"/><path d="M38 11v32"/><path d="M46 23v9"/></g><text x="78" y="23" fill="#14bfff" font-size="22" font-weight="700">Voice-Reactive Waveform</text><text x="78" y="57" fill="#c5d0e4" font-size="18">A live waveform that</text><text x="78" y="82" fill="#c5d0e4" font-size="18">responds as you speak</text></g>
 <path d="M870 561v94" stroke="#314365"/>
 <g transform="translate(900 560)"><rect width="54" height="54" rx="14" fill="#10264a" stroke="#28539a"/><path d="M27 11 44 20 27 29 10 20Z M10 28l17 9 17-9 M10 36l17 9 17-9" fill="#13bdff"/><text x="78" y="23" fill="#14bfff" font-size="22" font-weight="700">Frosted Glass UI</text><text x="78" y="57" fill="#c5d0e4" font-size="18">A compact player that</text><text x="78" y="82" fill="#c5d0e4" font-size="18">stays out of your way</text></g>
 <path d="M1250 561v94" stroke="#314365"/>
 <g transform="translate(1280 560)"><rect width="54" height="54" rx="14" fill="#10264a" stroke="#28539a"/><rect x="11" y="12" width="32" height="23" rx="2" fill="none" stroke="#13bdff" stroke-width="3.5"/><path d="M27 36v7m-9 0h18" stroke="#13bdff" stroke-width="3.5" stroke-linecap="round"/><text x="78" y="23" fill="#14bfff" font-size="22" font-weight="700">Windows + macOS</text><text x="78" y="57" fill="#c5d0e4" font-size="18">One simple listening</text><text x="78" y="82" fill="#c5d0e4" font-size="16">experience on both platforms</text></g>
</g>
</svg>